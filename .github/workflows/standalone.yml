name: Standalone
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[server,bot]" pyinstaller
      - run: python -m PyInstaller --clean --noconfirm tgx.spec
      - uses: actions/upload-artifact@v4
        with:
          name: tgx-${{ matrix.os }}
          path: dist/tgx*
