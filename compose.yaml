services:
  tgx:
    build: .
    image: telegram-exporter:local
    volumes:
      - tgx-data:/data
      - ./exports:/exports
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    command: ["serve", "--host", "0.0.0.0"]
  bot:
    profiles: [bot]
    image: telegram-exporter:local
    env_file: .env
    environment:
      TGX_API_URL: http://tgx:8765
    command: ["bot"]
    depends_on: [tgx]
    restart: unless-stopped
  proxy:
    profiles: [public]
    image: caddy:2
    environment:
      TGX_DOMAIN: ${TGX_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [tgx]
    restart: unless-stopped

volumes:
  tgx-data:
  caddy-data:
  caddy-config:
